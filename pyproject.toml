[project]
name = "ai-pdf-assistant"
version = "1.0.0"
description = "AI-powered PDF assistant with FastAPI and retrieval-augmented generation"
requires-python = ">=3.12,<3.15"
dependencies = [
    "chromadb==1.5.9",
    "fastapi==0.138.2",
    "openai==2.33.0",
    "PyMuPDF==1.28.0",
    "python-multipart==0.0.32",
    "sentence-transformers==5.6.0",
    "transformers==4.54.0",
    "uvicorn[standard]==0.49.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
